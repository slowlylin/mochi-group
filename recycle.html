<!doctype html>
<html lang="zh-Hant-TW">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head>
<body>
<title>艾奧傑亞環保局零式</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" href="/mochi.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;700;900&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* 版面：左邊是副本場地（Canvas），右邊是詠唱條＋分類紀錄；手機時上下堆疊。單一深色「副本 HUD」風格。 */
:root{
  --bg:#0c1311; --panel:#121d1a; --panel2:#182622; --line:rgba(140,200,170,.18);
  --fg:#e9f1ec; --dim:#93a89f; --accent:#6fd3a0; --gold:#e8c27a; --bad:#ff5c74;
  --paper:#4a8fe0; --plastic:#e0505a; --food:#e8c440; --general:#48b06a; --metal:#9aa7b4; --glass:#4fc6c6;
  --f-body:"Noto Sans TC","Noto Sans JP","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-disp:"Noto Serif TC","Noto Serif JP",serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;border-bottom:1px solid var(--line);padding-bottom:14px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand .eyebrow{font-size:12px;letter-spacing:.18em;color:var(--accent);font-weight:700}
.brand h1{margin:0;font-family:var(--f-disp);font-weight:900;font-size:clamp(22px,4vw,32px);letter-spacing:.04em;text-wrap:balance}
.brand h1 small{font-size:.6em;color:var(--gold);margin-left:.4em}
.ctrls{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;color:var(--dim);font:inherit;font-size:13px;padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--fg);font-weight:700}
.seg button:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.home{color:var(--dim);font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px}
.home:hover{color:var(--accent);border-color:var(--accent)}
.note{font-size:13px;color:var(--dim);border-left:3px solid var(--gold);padding:8px 12px;background:var(--panel)}
.note b{color:var(--gold)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:1fr}}
.stage{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.castbar{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;min-height:58px}
.castbar .who{font-size:12px;color:var(--dim);letter-spacing:.08em}
.castbar .name{font-size:18px;font-weight:700}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#ffdf9e)}
canvas#arena{display:block;width:100%;max-width:640px;aspect-ratio:1/1;margin:0 auto;border-radius:10px;touch-action:none;cursor:crosshair}
.hud{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);margin-top:8px;font-variant-numeric:tabular-nums}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h2{margin:0 0 8px;font-size:14px;letter-spacing:.12em;color:var(--accent)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:13px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.log{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto;font-size:13px}
.log .row{border-top:1px solid var(--line);padding-top:8px}
.log .row:first-child{border-top:0;padding-top:0}
.log .ok{color:var(--accent);font-weight:700}.log .ng{color:var(--bad);font-weight:700}
.log .why{color:var(--dim)}
.log .disp{color:var(--gold)}
.empty{color:var(--dim);font-size:13px}
.btn{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);padding:9px 16px;font-weight:700}
.btn.pri{background:var(--accent);color:#08231a;border-color:var(--accent)}
.btn.gold{border-color:var(--gold);color:var(--gold);background:none}
.ov{position:absolute;inset:12px;display:flex;align-items:center;justify-content:center;background:rgba(6,10,9,.72);border-radius:10px;padding:16px;overflow:auto}
.ovbox{max-width:540px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px;text-align:center}
.ovbox h3{margin:0;font-size:22px}
.ovbox p{margin:0}
.ovbox .btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
.ovbox.death{background:#140b0e;border-color:rgba(255,92,116,.5)}
.ovbox.death .t{font-size:34px;font-weight:900;color:var(--bad);font-family:var(--f-disp);letter-spacing:.08em}
.ovbox.death .s{font-size:12px;letter-spacing:.3em;color:#c9a0a8}
.ovbox.death .q{font-size:17px}
.ovbox.death hr{border:0;border-top:1px solid rgba(255,92,116,.35);margin:4px 0;width:100%}
.ovbox .ans{font-weight:700;color:var(--accent)}
.ovbox .why{font-size:14px;color:var(--dim)}
.ovbox .disp{font-size:13px;color:var(--gold)}
.ovbox img{width:100%;border-radius:12px}
.how{font-size:13px;color:var(--dim)}
.how kbd{border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:12px;color:var(--fg)}
footer{font-size:12px;color:var(--dim);border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
footer a{color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <span class="eyebrow" data-t="eyebrow"></span>
      <h1><span data-t="title"></span><small data-t="subtitle"></small></h1>
    </div>
    <div class="ctrls">
      <div class="seg" role="group" aria-label="語言 / 言語">
        <button id="lang-zh" type="button" aria-pressed="true">中文</button>
        <button id="lang-ja" type="button" aria-pressed="false">日本語</button>
      </div>
      <div class="seg" role="group" aria-label="難度">
        <button id="mode-n" type="button" aria-pressed="true" data-t="normal"></button>
        <button id="mode-s" type="button" aria-pressed="false" data-t="savage"></button>
      </div>
      <a class="home" href="index.html" data-t="home"></a>
    </div>
  </header>

  <p class="note" data-t-html="notice"></p>

  <div class="main">
    <div class="stage">
      <div class="castbar">
        <span class="who" data-t="boss"></span>
        <span class="name" id="castName">—</span>
        <div class="bar"><i id="castFill"></i></div>
      </div>
      <canvas id="arena" width="720" height="720" aria-label="分類場地"></canvas>
      <div class="hud"><span id="hudQ"></span><span id="hudScore"></span></div>
      <div class="ov" id="ov"></div>
    </div>
    <div class="side">
      <div class="card">
        <h2 data-t="binsTitle"></h2>
        <div class="legend" id="legend"></div>
        <p class="how" data-t-html="how" style="margin:10px 0 0"></p>
      </div>
      <div class="card">
        <h2 data-t="logTitle"></h2>
        <div class="log" id="log"><span class="empty" data-t="logEmpty"></span></div>
      </div>
    </div>
  </div>

  <footer>
    <span data-t="foot1"></span>
    <span><span data-t="foot2"></span>
      <a href="https://recycle.moenv.gov.tw/" target="_blank" rel="noopener">環境部資源回收網</a>・
      <a href="https://www.pro360.com.tw/guide/taipei_waste_sorting" target="_blank" rel="noopener">臺北市分類整理</a>・
      <a href="https://health.tvbs.com.tw/nutrition/360765" target="_blank" rel="noopener">蛋殼各縣市分類</a>・
      <a href="https://www.nownews.com/news/6638453" target="_blank" rel="noopener">吸管各縣市分類</a>・
      <a href="https://supertaste.tvbs.com.tw/food/353815" target="_blank" rel="noopener">發票與收據</a></span>
    <span>小麻糬發瘋產業集團・艾奧傑亞環保局</span>
  </footer>
</div>

  // 地板
  x.fillStyle='#0f1a17'; x.fillRect(0,0,W,H);
  x.strokeStyle='rgba(140,200,170,.07)'; x.lineWidth=1; for(let i=40;i<W;i+=40){ x.beginPath(); x.moveTo(i,0); x.lineTo(i,H); x.stroke(); x.beginPath(); x.moveTo(0,i); x.lineTo(W,i); x.stroke(); }
  x.strokeStyle='rgba(111,211,160,.35)'; x.lineWidth=3; x.beginPath(); x.arc(C.x,C.y,W*0.47,0,Math.PI*2); x.stroke();
  // 回收桶區
  binPos().forEach(z=>{ const col=css(BINS[z.b].c);
    x.fillStyle=col+'33'; x.strokeStyle=col; x.lineWidth=4; x.beginPath(); x.arc(z.x,z.y,ZR,0,Math.PI*2); x.fill(); x.stroke();
    emoji(x,40,BINS[z.b].e,{x:z.x,y:z.y-12});
    x.fillStyle='#f1f6f3'; x.font=`700 ${lang==='ja'?20:22}px "Noto Sans TC","Noto Sans JP",sans-serif`; x.textAlign='center'; x.textBaseline='middle'; x.fillText(BINS[z.b][lang], z.x, z.y+30);
  });
  if(G.flash && now-G.flash.t<0.8){ const a=1-(now-G.flash.t)/0.8; x.strokeStyle=`rgba(111,211,160,${a})`; x.lineWidth=10; x.beginPath(); x.arc(G.flash.x,G.flash.y,ZR+10*(1-a)+6,0,Math.PI*2); x.stroke();
    x.fillStyle=`rgba(111,211,160,${a})`; x.font='900 34px "Noto Sans TC",sans-serif'; x.textAlign='center'; x.fillText(tr('ok'),C.x,C.y+ZR+40); }
  // 王＋詠唱中的垃圾
  x.fillStyle='#1c2b27'; x.strokeStyle='#e8c27a'; x.lineWidth=3; x.beginPath(); x.arc(C.x,C.y,46,0,Math.PI*2); x.fill(); x.stroke();
  emoji(x,48,'🚛',C);
  if(G.state==='cast'||G.state==='dead'){ const it=G.q[G.idx]; x.fillStyle='rgba(12,19,17,.85)'; rr(x,C.x-74,C.y-150,148,92,16); x.fill(); x.strokeStyle='#e8c27a'; x.lineWidth=2; x.stroke(); emoji(x,60,it.e,{x:C.x,y:C.y-104}); }
  // 玩家
  if(G.p){ x.fillStyle='#ffffff'; x.strokeStyle='#08231a'; x.lineWidth=4; x.beginPath(); x.arc(G.p.x,G.p.y,15,0,Math.PI*2); x.fill(); x.stroke();
    x.fillStyle='#6fd3a0'; x.font='700 18px "Noto Sans TC",sans-serif'; x.textAlign='center'; x.textBaseline='bottom'; x.fillText(lang==='zh'?'你':'あなた',G.p.x,G.p.y-18);
    if(G.target){ x.strokeStyle='rgba(255,255,255,.4)'; x.setLineDash([6,6]); x.beginPath(); x.moveTo(G.p.x,G.p.y); x.lineTo(G.target.x,G.target.y); x.stroke(); x.setLineDash([]); } }
}

$('lang-zh').onclick=()=>{ lang='zh'; SS('epa_lang',lang); applyLang(); if(G.state==='cast') setCast(); };
$('lang-ja').onclick=()=>{ lang='ja'; SS('epa_lang',lang); applyLang(); if(G.state==='cast') setCast(); };
$('mode-n').onclick=()=>{ if(G.state==='cast'||G.state==='pause'||G.state==='dead') return; mode='n'; SS('epa_mode',mode); applyLang(); };
$('mode-s').onclick=()=>{ if(G.state==='cast'||G.state==='pause'||G.state==='dead') return; mode='s'; SS('epa_mode',mode); applyLang(); };
window.__epa={get G(){return G}, start, next, binPos, ITEMS, setLang:l=>{lang=l;applyLang();}, setMode:m=>{mode=m;applyLang();}};
applyLang(); requestAnimationFrame(frame);
</script>
